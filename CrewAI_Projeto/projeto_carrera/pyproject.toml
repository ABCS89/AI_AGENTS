[project]
name = "projeto_carrera"
version = "0.1.0"
description = "projeto_carrera using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.201.1,<1.0.0"
]

[project.scripts]
projeto_carrera = "projeto_carrera.main:run"
run_crew = "projeto_carrera.main:run"
train = "projeto_carrera.main:train"
replay = "projeto_carrera.main:replay"
test = "projeto_carrera.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
