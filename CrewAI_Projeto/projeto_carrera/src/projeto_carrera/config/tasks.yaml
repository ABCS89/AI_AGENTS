definir_escopo:
  description: >
    Identificar o problema, definir objetivos do sistema e listar os papéis necessários para os agentes.
  expected_output: >
    Documento inicial com o escopo do sistema e a lista de agentes propostos.
  agent: analista_de_negocios

# 2 ------------------------------------------------------------------------------

modelar_agentes:
  description: >
    Descrever cada agente com seu papel, responsabilidades e capacidades, registrando no arquivo agents.yaml.
  expected_output: >
    Arquivo agents.yaml estruturado com todos os agentes definidos.
  agent: arquiteto_de_sistemas

# 3 ------------------------------------------------------------------------------

planejar_tarefas:
  description: >
    Mapear as tarefas principais, definir entradas e saídas e atribuí-las a cada agente, registrando no arquivo tasks.yaml.
  expected_output: >
    Arquivo tasks.yaml contendo todas as tarefas especificadas e seus agentes responsáveis.
  agent: engenheiro_de_processos

# 4 ------------------------------------------------------------------------------

implementar_orquestracao:
  description: >
    Criar o script crew.py que importa os arquivos agents.yaml e tasks.yaml e coordena a execução das tarefas pelos agentes.
  expected_output: >
    Arquivo crew.py funcional, capaz de orquestrar agentes e tarefas em sequência lógica.

    o arquivo deve seguir a seguinte fromatação:

    from crewai import Agent, Crew, Process, Task
    from crewai.project import CrewBase, agent, crew, task
    from crewai.agents.agent_builder.base_agent import BaseAgent
    from typing import List
    # If you want to run a snippet of code before or after the crew starts,
    # you can use the @before_kickoff and @after_kickoff decorators
    # https://docs.crewai.com/concepts/crews#example-crew-class-with-decorators

    import agentops
    import os
    from dotenv import load_dotenv

    _ = load_dotenv()  # take environment variables from .env.
    AGENTOPS_API_KEY = os.getenv("AGENTOPS_API_KEY")
    agentops.init(api_key=AGENTOPS_API_KEY)


    @CrewBase
    class ProjetoCarrera():
        """ProjetoCarrera crew"""

        agents: List[BaseAgent]
        tasks: List[Task]

        # Learn more about YAML configuration files here:
        # Agents: https://docs.crewai.com/concepts/agents#yaml-configuration-recommended
        # Tasks: https://docs.crewai.com/concepts/tasks#yaml-configuration-recommended

        # If you would like to add tools to your agents, you can learn more about it here:
        # https://docs.crewai.com/concepts/agents#agent-tools
        @agent
        def researcher(self) -> Agent:
            return Agent(
                config=self.agents_config['researcher'], # type: ignore[index]
                verbose=True
            )

        @agent
        def reporting_analyst(self) -> Agent:
            return Agent(
                config=self.agents_config['reporting_analyst'], # type: ignore[index]
                verbose=True
            )

        # To learn more about structured task outputs,
        # task dependencies, and task callbacks, check out the documentation:
        # https://docs.crewai.com/concepts/tasks#overview-of-a-task
        @task
        def research_task(self) -> Task:
            return Task(
                config=self.tasks_config['research_task'], # type: ignore[index]
            )

        @task
        def reporting_task(self) -> Task:
            return Task(
                config=self.tasks_config['reporting_task'], # type: ignore[index]
                output_file='report.md'
            )

        @crew
        def crew(self) -> Crew:
            """Creates the ProjetoCarrera crew"""
            # To learn how to add knowledge sources to your crew, check out the documentation:
            # https://docs.crewai.com/concepts/knowledge#what-is-knowledge

            return Crew(
                agents=self.agents, # Automatically created by the @agent decorator
                tasks=self.tasks, # Automatically created by the @task decorator
                process=Process.sequential,
                verbose=True,
                # process=Process.hierarchical, # In case you wanna use that instead https://docs.crewai.com/how-to/Hierarchical/
            )

  agent: desenvolvedor_backend

# 5 ------------------------------------------------------------------------------

validar_sistema:
  description: >
    Testar a execução do sistema, validar entradas e saídas e corrigir inconsistências identificadas.
  expected_output: >
    Sistema validado, com agents.yaml, tasks.yaml e crew.py funcionando corretamente.
  agent: qa_testador
