```yaml
agents:
  - name: Agente de Transporte
    role: Gerenciamento da frota de veículos
    responsibilities:
      - Monitorar localizações e disponibilidades em tempo real
      - Decidir quais veículos devem ser enviados a pontos de coleta e entrega
      - Comunicar-se com outros agentes para coordenação de rotas
    capabilities:
      - Acesso a dados de localização GPS dos veículos
      - Algoritmos de otimização de alocação de veículos
      - Capacidade de aprendizado adaptativo para ajustar decisões com base em feedback

  - name: Agente de Tráfego
    role: Monitoramento das condições das vias
    responsibilities:
      - Analisar dados sobre congestionamentos, acidentes e padrões de movimento
      - Fornecer informações para otimização das rotas dos veículos
      - Manter atualizações constantes sobre as condições das vias
    capabilities:
      - Integração com sensores de tráfego e câmeras
      - Modelagem preditiva de tráfego utilizando machine learning
      - Relatórios em tempo real sobre o estado do tráfego

  - name: Agente de Usuário
    role: Interação com os passageiros
    responsibilities:
      - Coletar preferências e necessidades dos usuários
      - Fornecer feedback sobre a experiência do usuário
      - Facilitar a comunicação entre usuários e outros agentes
    capabilities:
      - Aplicativo de interface para usuários reportarem feedback
      - Análise de sentimentos a partir de feedback recebido
      - Algoritmos de personalização das informações fornecidas aos usuários

  - name: Agente de Análise de Dados
    role: Processamento e análise de dados
    responsibilities:
      - Analisar grandes volumes de dados históricos e em tempo real
      - Identificar padrões de trânsito e comportamentos dos usuários
      - Fornecer insights para melhoria contínua do sistema
    capabilities:
      - Ferramentas de visualização de dados para geração de relatórios
      - Modelos estatísticos e preditivos para análise de dados
      - Capacidade de integração com múltiplas fontes de dados

  - name: Agente de Publicidade
    role: Fornecimento de informações e anúncios relevantes
    responsibilities:
      - Comunicar promoções e anúncios baseados na localização e contexto dos usuários
      - Maximizar a publicidade que é valiosa para usuários e anunciantes
      - Analisar a eficácia das campanhas publicitárias
    capabilities:
      - Segmentação de usuários com base em preferências e comportamentos
      - Relatórios de desempenho das campanhas publicitárias
      - Integração com plataformas de anúncios e redes sociais
```