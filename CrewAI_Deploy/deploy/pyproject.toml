[project]
name = "deploy"
version = "0.1.0"
description = "deploy using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.201.1,<1.0.0"
]

[project.scripts]
deploy = "deploy.main:run"
run_crew = "deploy.main:run"
train = "deploy.main:train"
replay = "deploy.main:replay"
test = "deploy.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
